<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Bicycle Shop and Accessories Store</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 50%, #f1f3f5 100%);
            color: #1A1A2E;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .dark body, body.dark {
            background: linear-gradient(135deg, #1d3557 0%, #14243d 50%, #0b1622 100%);
            color: #ffffff;
        }

        .bg-pattern {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-pattern::before {
            content: '\f206';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            font-size: 300px;
            color: rgba(229, 57, 53, 0.03);
            top: -50px; right: -80px;
            transform: rotate(-15deg);
        }

        .bg-pattern::after {
            content: '\f206';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            font-size: 250px;
            color: rgba(229, 57, 53, 0.02);
            bottom: -60px; left: -70px;
            transform: rotate(20deg);
        }

        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
        }

        .glow-orb.orb1 { width: 400px; height: 400px; background: rgba(229,57,53,0.1); top: -100px; right: -100px; }
        .glow-orb.orb2 { width: 350px; height: 350px; background: rgba(29,53,87,0.25); bottom: -80px; left: -80px; }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
        }

        .dark .glass-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .input-group { position: relative; margin-bottom: 20px; }

        .input-group .input-icon {
            position: absolute;
            left: 16px; top: 50%;
            transform: translateY(-50%);
            color: #6B7280;
            font-size: 15px;
            transition: color 0.3s ease;
            z-index: 2;
        }

        .dark .input-group .input-icon { color: rgba(255, 255, 255, 0.4); }

        .input-group input {
            width: 100%;
            padding: 15px 48px 15px 48px;
            background: #FFFFFF;
            border: 1.5px solid #DEE2E6;
            border-radius: 14px;
            color: #1A1A2E;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder { color: #9CA3AF; }

        .dark .input-group input {
            background: rgba(255, 255, 255, 0.06);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .dark .input-group input::placeholder { color: rgba(255, 255, 255, 0.35); }

        .input-group input:focus {
            border-color: rgba(229,57,53,0.5);
            box-shadow: 0 0 0 3px rgba(229,57,53,0.1);
        }

        .input-group:focus-within .input-icon { color: #E53935; }

        .input-group.error input { border-color: rgba(239,68,68,0.6); }
        .input-group.success input { border-color: rgba(34,197,94,0.6); }

        .validation-msg { font-size: 12px; margin-top: 6px; padding-left: 4px; display: none; }
        .input-group.error .validation-msg.error-msg { display: block; color: #ef4444; }
        .input-group.success .validation-msg.success-msg { display: block; color: #22c55e; }

        .password-toggle {
            position: absolute;
            right: 16px; top: 50%;
            transform: translateY(-50%);
            color: #6B7280;
            cursor: pointer;
            transition: color 0.3s ease;
            z-index: 2;
            background: none; border: none;
            font-size: 16px;
            padding: 4px;
        }

        .dark .password-toggle { color: rgba(255, 255, 255, 0.4); }

        .password-toggle:hover { color: #111827; }
        .dark .password-toggle:hover { color: rgba(255, 255, 255, 0.75); }

        .custom-checkbox { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
        .custom-checkbox input[type="checkbox"] { display: none; }

        .checkmark {
            width: 20px; height: 20px;
            border: 2px solid #DEE2E6;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
            background: #FFFFFF;
        }

        .dark .checkmark {
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: transparent;
        }

        .checkmark i { font-size: 10px; color: #fff; opacity: 0; transform: scale(0.5); transition: all 0.2s ease; }
        .custom-checkbox input[type="checkbox"]:checked ~ .checkmark { background: #E53935; border-color: #E53935; }
        .custom-checkbox input[type="checkbox"]:checked ~ .checkmark i { opacity: 1; transform: scale(1); }
        .custom-checkbox span { color: #4B5563; font-size: 14px; }
        .dark .custom-checkbox span { color: rgba(255, 255, 255, 0.55); }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #E53935 0%, #C62828 100%);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
            transition: left 0.5s ease;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(229,57,53,0.35); }
        .btn-submit:hover::before { left: 100%; }
        .btn-submit:active { transform: translateY(0); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

        .divider { display: flex; align-items: center; margin: 24px 0; gap: 16px; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #DEE2E6; }
        .dark .divider::before, .dark .divider::after { background: rgba(255, 255, 255, 0.08); }
        .divider span { color: #6B7280; font-size: 13px; white-space: nowrap; letter-spacing: 0.02em; }
        .dark .divider span { color: rgba(255, 255, 255, 0.4); }

        .social-btn {
            flex: 1;
            padding: 13px;
            background: #FFFFFF;
            border: 1.5px solid #E5E7EB;
            border-radius: 12px;
            color: #374151;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
        }

        .dark .social-btn {
            background: rgba(255,255,255,0.04);
            border: 1.5px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.75);
        }

        .social-btn span { font-size: 14px; }
        .social-btn:hover { background: #F9FAFB; border-color: #D1D5DB; transform: translateY(-2px); }
        .dark .social-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15); }
        .social-btn.google:hover { border-color: rgba(234,67,53,0.4); color: #ea4335; }
        .social-btn.facebook:hover { border-color: rgba(24,119,242,0.4); color: #1877f2; }
        .social-btn.apple:hover { border-color: #111827; color: #111827; }
        .dark .social-btn.apple:hover { border-color: rgba(255,255,255,0.3); color: #ffffff; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-container { animation: fadeSlideIn 0.5s ease; }

        .loading-screen {
            position: fixed;
            inset: 0;
            background: #0b1622;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-screen.hidden { opacity: 0; visibility: hidden; }

        .loader-spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(229,57,53,0.15);
            border-top-color: #E53935;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #scroll-top {
            position: fixed;
            bottom: 30px; right: 30px;
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #E53935, #C62828);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            z-index: 1000;
            opacity: 0; visibility: hidden;
            transform: translateY(20px);
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(229,57,53,0.35);
            border: none;
        }

        #scroll-top.visible { opacity: 1; visibility: visible; transform: translateY(0); }
        #scroll-top:hover { transform: translateY(-4px); box-shadow: 0 12px 35px rgba(229,57,53,0.45); }

        @media (max-width: 640px) {
            .glass-card { padding: 24px 20px !important; border-radius: 20px; }
            .input-group input { padding: 13px 44px 13px 44px; font-size: 15px; }
            .btn-submit { padding: 13px; font-size: 15px; }
            .social-btn { padding: 11px; }
            .social-btn span { font-size: 13px; }
        }

        @media (min-width: 641px) and (max-width: 1024px) {
            .glass-card { padding: 36px 32px !important; }
        }

        @media (min-width: 1025px) {
            .glass-card { padding: 44px 40px !important; }
        }
        [dir="rtl"] .top-controls { right: auto; left: 1rem; }
        [dir="rtl"] .input-group input { text-align: right; padding-right: 48px !important; padding-left: 48px !important; }
        [dir="rtl"] .input-group .input-icon { left: auto; right: 16px; }
        [dir="rtl"] .password-toggle { right: auto; left: 16px; }
        [dir="rtl"] .validation-msg { text-align: right; padding-right: 4px; padding-left: 0; }
    </style>
</head>
<body>
    <div id="loading-screen" class="loading-screen">
        <div class="loader-spinner"></div>
        <p style="color: rgba(255,255,255,0.5); margin-top: 16px; font-size: 13px; letter-spacing: 0.05em;">Loading...</p>
    </div>

    <div class="top-controls fixed top-4 right-4 z-50 flex items-center gap-2" dir="ltr">
        <button id="dark-toggle" class="w-10 h-10 bg-white/80 dark:bg-white/10 hover:bg-white text-slate-800 dark:text-amber-400 border border-gray-200 dark:border-white/10 shadow-sm rounded-xl flex items-center justify-center transition-all duration-300" aria-label="Toggle dark mode">
            <i class="fa-solid fa-moon text-slate-800 dark:text-amber-400 text-sm"></i>
        </button>
        <button class="action-btn w-10 h-10 bg-white/80 dark:bg-white/10 hover:bg-white text-gray-700 dark:text-white border border-gray-200 dark:border-white/10 shadow-sm rounded-xl flex items-center justify-center transition-all duration-300" id="btn-rtl-toggle" aria-label="Toggle LTR/RTL Layout" title="Switch layout direction">
          <span style="font-size: 14px; font-weight: 700;">⇄</span>
        </button>
    </div>

    <div class="bg-pattern"></div>
    <div class="glow-orb orb1"></div>
    <div class="glow-orb orb2"></div>

    <main class="min-h-screen flex items-center justify-center relative z-10 px-4 py-8 sm:px-6">
        <div class="glass-card w-full max-w-md p-8 sm:p-10 form-container" id="auth-card">
            <a href="index.html" class="flex items-center justify-center gap-3 mb-6 group">
                <div class="w-10 h-10 bg-[#E53935] rounded-xl flex items-center justify-center shadow-lg shadow-red-500/20 group-hover:scale-105 transition-transform duration-300">
                    <i class="fa-solid fa-bicycle text-white"></i>
                </div>
                <span class="text-gray-900 dark:text-white font-bold text-xl tracking-tight">Bicycle<span class="text-[#E53935]">Shop</span></span>
            </a>

            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Welcome Back</h1>
                <p class="text-sm text-gray-600 dark:text-white/60">Sign in to your account to continue</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="login-email" placeholder="Email Address" required autocomplete="email">
                    <span class="validation-msg error-msg">Please enter a valid email address</span>
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password" style="padding-right: 48px;">
                    <button type="button" class="password-toggle" onclick="togglePassword('login-password', this)" aria-label="Toggle password visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                    <span class="validation-msg error-msg">Password is required</span>
                </div>

                <div class="flex items-center justify-between mb-6">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="remember-me">
                        <div class="checkmark"><i class="fa-solid fa-check"></i></div>
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="text-sm font-semibold hover:underline" style="color: #E53935;">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Sign In
                </button>
            </form>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="flex gap-3 mb-6">
                <button class="social-btn google" type="button">
                    <i class="fa-brands fa-google"></i>
                    <span class="hidden sm:inline">Google</span>
                </button>
                <button class="social-btn facebook" type="button">
                    <i class="fa-brands fa-facebook-f"></i>
                    <span class="hidden sm:inline">Facebook</span>
                </button>
                <button class="social-btn apple" type="button">
                    <i class="fa-brands fa-apple"></i>
                    <span class="hidden sm:inline">Apple</span>
                </button>
            </div>

            <p class="text-center text-sm text-gray-600 dark:text-white/60">
                Don't have an account?
                <a href="signup.html" class="font-semibold hover:underline" style="color: #E53935;">Create one</a>
            </p>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        window.addEventListener('load', function () {
            setTimeout(function () {
                document.getElementById('loading-screen').classList.add('hidden');
            }, 600);
        });

        (function () {
            var savedDark = localStorage.getItem("darkMode") === "true";
            var darkToggle = document.getElementById("dark-toggle");
            var html = document.documentElement;

            function applyDark(dark) {
                if (dark) {
                    html.classList.add("dark");
                    darkToggle.innerHTML = '<i class="fa-solid fa-sun text-yellow-400 text-sm"></i>';
                } else {
                    html.classList.remove("dark");
                    darkToggle.innerHTML = '<i class="fa-solid fa-moon text-slate-800 text-sm"></i>';
                }
                localStorage.setItem("darkMode", dark);
            }

            applyDark(savedDark);
            darkToggle.addEventListener("click", function () {
                applyDark(!html.classList.contains("dark"));
            });
        })();

        (function () {
            var savedRTL = localStorage.getItem("rtlMode") === "true";
            var html = document.documentElement;

            function applyRTL(rtl) {
                html.setAttribute("dir", rtl ? "rtl" : "ltr");
                if (rtl) {
                    html.classList.add("rtl");
                } else {
                    html.classList.remove("rtl");
                }
                localStorage.setItem("rtlMode", rtl);
            }

            applyRTL(savedRTL);
            document.addEventListener("click", function (e) {
                var target = e.target.closest("#btn-rtl-toggle, #rtl-toggle");
                if (target) {
                    applyRTL(html.getAttribute("dir") !== "rtl");
                }
            });
        })();

        function togglePassword(inputId, btn) {
            var input = document.getElementById(inputId);
            var icon = btn.querySelector('i');

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function setInputError(inputEl, show) {
            var group = inputEl.closest('.input-group');
            if (show) {
                group.classList.add('error');
                group.classList.remove('success');
            } else {
                group.classList.remove('error');
                if (inputEl.value.trim()) {
                    group.classList.add('success');
                }
            }
        }

        function clearValidation() {
            document.querySelectorAll('.input-group').forEach(function (g) {
                g.classList.remove('error', 'success');
            });
        }

        function handleLogin(e) {
            e.preventDefault();
            var valid = true;

            var email = document.getElementById('login-email');
            var password = document.getElementById('login-password');

            if (!validateEmail(email.value)) {
                setInputError(email, true);
                valid = false;
            } else {
                setInputError(email, false);
            }

            if (!password.value.trim()) {
                setInputError(password, true);
                valid = false;
            } else {
                setInputError(password, false);
            }

            if (valid) {
                var btn = e.target.querySelector('.btn-submit');
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing In...';
                btn.disabled = true;
                setTimeout(function () {
                    btn.innerHTML = '<i class="fa-solid fa-check"></i> Success! Redirecting...';
                    setTimeout(function () {
                        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
                        btn.disabled = false;
                    }, 1500);
                }, 2000);
            }
        }

        document.querySelectorAll('.input-group input').forEach(function (input) {
            input.addEventListener('blur', function () {
                var val = this.value.trim();
                if (val) {
                    if (this.type === 'email' && !validateEmail(val)) {
                        setInputError(this, true);
                    } else {
                        setInputError(this, false);
                    }
                }
            });
        });
    </script>
</body>
</html>
